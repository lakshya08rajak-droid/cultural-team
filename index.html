<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cultural Team</title>
  <meta name="description" content="Official Cultural Team portal — ITM Skills University." />
  <meta name="theme-color" content="#24080E" />

  <!-- Preconnect & Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/styles.css?v=20261026-v2" />
  <style>
    body {
      background-color: #ffffff;
      background: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header Matching Reference Design -->
  <header class="cultural-header" id="cultural-header">
    <div class="header-content-wrap">
      <!-- Left: Stacked Branding -->
      <div class="header-left-stack">
        <!-- University Logo in Light-Coloured Rounded Container -->
        <div class="university-logo-box" aria-label="ITM Skills University">
          <img
            src="assets/itm-skills-university-logo.jpg"
            alt="ITM Skills University"
            class="university-logo-img"
            width="827"
            height="246"
            loading="eager"
          />
        </div>

        <!-- Cultural Team Circular Logo & Typography -->
        <a href="/" class="cultural-team-brand" aria-label="Cultural Team Home">
          <img
            src="assets/cultural-club-logo.jpg"
            alt="Cultural Team Crest"
            class="cultural-logo-circle"
            width="1024"
            height="978"
            loading="eager"
          />
          <span class="cultural-team-text">CULTURAL TEAM</span>
        </a>
      </div>

      <!-- Right: Actions (Share Ideas Button & Hamburger Menu) -->
      <div class="header-right-actions">
        <!-- Pill-Shaped Beige "Share Ideas" Button -->
        <a href="/share-ideas" class="header-btn-share-ideas" aria-label="Go to Share Ideas page">
          Share Ideas
        </a>

        <!-- Rounded Maroon Hamburger Button with 3 Horizontal Lines -->
        <button
          type="button"
          class="header-btn-hamburger"
          id="header-hamburger-toggle"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="nav-drawer"
        >
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Functional Navigation Drawer Modal / Backdrop -->
  <div class="nav-drawer-backdrop" id="nav-drawer-backdrop" aria-hidden="true"></div>
  <aside class="nav-drawer" id="nav-drawer" role="dialog" aria-modal="true" aria-label="Website Navigation Menu" inert>
    <div class="drawer-header">
      <div class="drawer-brand-group">
        <span class="drawer-tagline">ITM SKILLS UNIVERSITY</span>
        <span class="drawer-title">CULTURAL TEAM</span>
      </div>
      <button type="button" class="drawer-close-btn" id="drawer-close-btn" aria-label="Close navigation menu">
        ✕
      </button>
    </div>

    <nav class="drawer-nav" aria-label="Main Navigation Destinations">
      <ul class="drawer-nav-list">
        <li>
          <a href="/" class="drawer-nav-item is-active">
            <span class="drawer-item-icon">🏛️</span>
            <span class="drawer-item-label">Home</span>
            <span class="drawer-item-arrow">›</span>
          </a>
        </li>
        <li>
          <a href="/share-ideas" class="drawer-nav-item">
            <span class="drawer-item-icon">✨</span>
            <span class="drawer-item-label">Share Ideas</span>
            <span class="drawer-item-arrow">›</span>
          </a>
        </li>
        <li>
          <a href="/qr-code" class="drawer-nav-item">
            <span class="drawer-item-icon">📱</span>
            <span class="drawer-item-label">QR Code</span>
            <span class="drawer-item-arrow">›</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="drawer-footer">
      <a href="/share-ideas" class="drawer-cta-btn">
        Submit Your Event Suggestion
      </a>
      <p class="drawer-subtext">College Arts &amp; Cultural Committee</p>
    </div>
  </aside>

  <!-- Header Scripts -->
  <script src="js/header.js?v=20261026-v2"></script>
</body>
</html>
